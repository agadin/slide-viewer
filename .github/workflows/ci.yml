# Type check, logic tests (including the help-link check) and web build on every change to the app
# or its help pages.
name: CI
on:
  push:
    branches: [main]
    paths: ["app/**", "docs/**", "README.md", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["app/**", "docs/**", "README.md", ".github/workflows/ci.yml"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Logic tests (coordinates, NDPA round trip, filters, browser, viewer, help links)
        # test-data/ (real NDP.view2 files) isn't in the repo; tests that need it skip themselves
        run: npm run test:logic
      - name: Web build
        run: npm run build
