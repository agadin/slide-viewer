# Builds Slide Viewer on each platform and checks the slide libraries it bundles (OpenSlide, libCZI)
# open slides: the Rust tests and a slide on macOS (Apple silicon, Intel) and Windows; the macOS app
# bundle (tools/check-mac-bundle.sh); the Windows installer, installed and then used to open a slide.
# Runs when the native side or bundling changes, and on demand: the release script (tools/release.sh)
# starts it to get the Windows installer, which it signs locally.
name: Build
on:
  push:
    branches: [main]
    paths: ["app/src-tauri/**", "tools/fetch-*.sh", "tools/mac-bundle-config.py", "tools/check-mac-bundle.sh", "app/package-lock.json", ".github/workflows/build.yml"]
  pull_request:
    paths: ["app/src-tauri/**", "tools/fetch-*.sh", "tools/mac-bundle-config.py", "tools/check-mac-bundle.sh", "app/package-lock.json", ".github/workflows/build.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version the installer is for (set by tools/release.sh)"
        required: false
concurrency:
  group: build-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  # a small public slide from the OpenSlide test data
  TEST_SLIDE: https://openslide.cs.cmu.edu/download/openslide-testdata/Aperio/CMU-1-Small-Region.svs
  # and a small .czi, read by libCZI
  TEST_CZI: https://openslide.cs.cmu.edu/download/openslide-testdata/Zeiss/Zeiss-5-SlidePreview-JXR.czi
jobs:
  slides:
    name: Slide libraries smoke test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple silicon, os: macos-latest, lib: mac }
          - { name: macOS Intel, os: macos-15-intel, lib: mac }
          - { name: Windows, os: windows-latest, lib: windows }
    # Not for the version-bump push ("v0.1.2"): tools/release.sh starts its own run of this workflow
    # on that commit. (Update the prefix at 1.0.)
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'v0.')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.os }}
      - name: Fetch the native libraries
        run: |
          tools/fetch-openslide.sh ${{ matrix.lib }}
          if [ -x tools/fetch-libczi.sh ]; then tools/fetch-libczi.sh ${{ matrix.lib }}; fi
      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test --release --lib
      - name: Open a slide and render tiles with the fetched libraries
        working-directory: app/src-tauri
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/test.svs" "$TEST_SLIDE"
          slide="$RUNNER_TEMP/test.svs"
          if [ "${{ matrix.lib }}" = windows ]; then slide="$(cygpath -m "$slide")"; fi
          cargo run --release --example smoke -- "$slide"

  macos:
    name: macOS app bundle
    needs: slides
    # not in the run tools/release.sh starts (it only waits for the Windows installer, and builds,
    # signs and checks the macOS app itself)
    if: inputs.version == ''
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: macos-bundle
      - name: Fetch the native libraries
        run: |
          tools/fetch-openslide.sh mac
          tools/fetch-libczi.sh mac
      - working-directory: app
        run: npm ci
      - name: Build the app (this Mac's architecture, unsigned)
        working-directory: app
        # the same library list as tools/release.sh; the updater signature needs the release key
        run: npx tauri build --bundles app --config "$(python3 ../tools/mac-bundle-config.py | jq -c '. * {"bundle":{"createUpdaterArtifacts":false}}')"
      - name: Check the bundled libraries, and open slides with only those
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/test.svs" "$TEST_SLIDE"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/test.czi" "$TEST_CZI"
          tools/check-mac-bundle.sh app/src-tauri/target/release/bundle/macos/*.app "$RUNNER_TEMP/test.svs" "$RUNNER_TEMP/test.czi"

  windows:
    name: Windows installer
    needs: slides
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: windows-bundle
      - name: Fetch the native libraries
        run: |
          tools/fetch-openslide.sh windows
          if [ -x tools/fetch-libczi.sh ]; then tools/fetch-libczi.sh windows; fi
          ls -l app/src-tauri/lib
      - name: Check the version matches the release
        if: inputs.version != ''
        run: |
          v=$(node -p 'require("./app/src-tauri/tauri.conf.json").version')
          [ "$v" = "${{ inputs.version }}" ] || { echo "tauri.conf.json is $v, release is ${{ inputs.version }}"; exit 1; }
      - working-directory: app
        run: npm ci
      - name: Build the installer
        working-directory: app
        # The updater signature is added by tools/release.sh on the release machine, so the key
        # never leaves it. Every DLL in src-tauri/lib is bundled ("lib/*.dll" in tauri.windows.conf.json).
        run: npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Install it and open a slide with only the installed DLLs
        # Proves the installer carries every DLL the slide libraries need: the smoke test runs from
        # the install folder with the source-tree copies moved out of the way.
        run: |
          exe=$(ls app/src-tauri/target/release/bundle/nsis/*.exe | head -1)
          "$exe" //S
          dir="$LOCALAPPDATA/Slide Viewer"
          for _ in $(seq 1 30); do [ -f "$dir/libopenslide-1.dll" ] && break; sleep 2; done
          echo "installed:"; ls -l "$dir"
          for f in app/src-tauri/lib/*.dll; do
            [ -f "$dir/$(basename "$f")" ] || { echo "the installer is missing $(basename "$f")"; exit 1; }
          done
          (cd app/src-tauri && cargo build --release --example smoke)
          cp app/src-tauri/target/release/examples/smoke.exe "$dir/"
          mv app/src-tauri/lib "$RUNNER_TEMP/lib-moved"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/test.svs" "$TEST_SLIDE"
          (cd "$dir" && ./smoke.exe "$(cygpath -m "$RUNNER_TEMP/test.svs")")
          mv "$RUNNER_TEMP/lib-moved" app/src-tauri/lib
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
