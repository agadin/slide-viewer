# After a release is published (tools/release.sh), checks it the way installed copies will see it:
# latest.json names the new version and all three platforms, every download is there and its
# signature verifies against the updater key in tauri.conf.json (tools/check-release.sh).
# Re-run by hand from the Actions tab with a version, e.g. 0.1.2.
name: Release check
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to check (e.g. 0.1.2)"
        required: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      - name: Check the release and its update files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: tools/check-release.sh "${VERSION#v}"
